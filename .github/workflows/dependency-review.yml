name: dependency-review

# Fails a pull request that adds an action version with a known vulnerability,
# using GitHub's advisories.

on:
  # Only pull requests into main, rerun when one is edited, so that checks that
  # passed against another base never count for main (see ci.yml).
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
