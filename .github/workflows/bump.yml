name: bump

# Proposes a bump of each formula to its project's latest release, every hour.
#
# `render` writes the formulae with this repository's own scripts, from main, and
# holds no secret: scripts/formula.py refuses warden's manifest unless its
# signature verifies against release-signers, and scripts/landfall.py refuses
# landfall's formula unless its tag's signature verifies against
# landfall-release-signers and its build provenance attestation checks out. Both
# refuse a version older than main's, and releases/latest is never a pre-release.
#
# `propose` opens a pull request for each formula that changed, with auto-merge
# on. It runs nothing from this repository, uses no checkout, and reads the
# formulae from `render` only as data. CI's required checks verify each formula
# again, with main's scripts and keys, and install it on each platform, so the
# pull request merges only if they pass.
#
# HOMEBREW_TAP_TOKEN, a secret of the homebrew-tap environment, which only main
# can use, is a fine-grained token limited to this repository, with read and write
# access to its contents and pull requests and none to its workflows. Only
# `propose` sees it. When it expires, `propose` fails: replace it, then rerun.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  render:
    # A manual run from another branch would render with that branch's scripts.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: landfall.py's floor is the highest version
          # Formula/landfall.rb has had.
          fetch-depth: 0
          persist-credentials: false
      - name: Render warden's formula from its latest release
        id: warden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/pecheriere/warden/releases/latest --jq .tag_name)
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::warden's latest release is not a release version: $tag"
            exit 1
          fi
          version=${tag#v}
          python3 -I scripts/formula.py render "$version" Formula/warden.rb
          if git diff --quiet -- Formula/warden.rb; then
            echo "The formula is already at warden $version."
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      # Runs even when warden's step failed, so that one project's trouble does
      # not hold up the other's bump; the run still fails, so it shows.
      - name: Fetch landfall's formula from its latest release
        id: landfall
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git cat-file -e HEAD:Formula/landfall.rb 2> /dev/null; then
            echo "main has no Formula/landfall.rb yet: the first one comes in a commit the maintainer signs."
            exit 0
          fi
          tag=$(gh api repos/pecheriere/landfall/releases/latest --jq .tag_name)
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::landfall's latest release is not a release version: $tag"
            exit 1
          fi
          version=${tag#v}
          python3 -I scripts/landfall.py fetch "$version" Formula/landfall.rb
          if git diff --quiet -- Formula/landfall.rb; then
            echo "The formula is already at landfall $version."
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Gather the formulae that changed
        id: collect
        if: ${{ !cancelled() }}
        env:
          WARDEN: ${{ steps.warden.outputs.version }}
          LANDFALL: ${{ steps.landfall.outputs.version }}
        run: |
          out="$RUNNER_TEMP/formulae"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/base-commit"
          changed=
          for name in warden landfall; do
            if [ "$name" = warden ]; then version=$WARDEN; else version=$LANDFALL; fi
            [ -n "$version" ] || continue
            cp "Formula/$name.rb" "$out/$name.rb"
            git rev-parse "HEAD:Formula/$name.rb" > "$out/$name.base-blob"
            echo "$version" > "$out/$name.version"
            changed="$changed $name"
          done
          echo "changed=${changed# }" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.collect.outputs.changed != '' }}
        with:
          name: formulae
          path: ${{ runner.temp }}/formulae
          retention-days: 1

  propose:
    needs: render
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.render.outputs.changed != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: homebrew-tap
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formulae
          path: formulae
      # The commit is made through the API with the token, so it is not one the
      # maintainer signed. It passes CI's scope check only because it modifies an
      # existing Formula/<name>.rb, as a regular file, and nothing else.
      - name: Open a pull request for each formula that changed, with auto-merge on
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CHANGED: ${{ needs.render.outputs.changed }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=^[0-9a-f]{40}$
          base_commit=$(cat formulae/base-commit)
          if ! [[ "$REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ && "$base_commit" =~ $sha ]]; then
            echo "::error::the render job's output is malformed"
            exit 1
          fi
          for name in $CHANGED; do
            if ! [[ "$name" =~ ^(warden|landfall)$ ]]; then
              echo "::error::not a formula this workflow bumps: $name"
              exit 1
            fi
            version=$(cat "formulae/$name.version")
            base_blob=$(cat "formulae/$name.base-blob")
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$base_blob" =~ $sha ]]; then
              echo "::error::the render job's output for $name is malformed"
              exit 1
            fi
            branch=$name-$version
            # 404 means there is no such branch; anything else but success is an error.
            status=$(gh api "repos/$REPO/branches/$branch" --include 2> /dev/null | awk 'NR == 1 { print $2 }' || true)
            if [ "$status" = 200 ]; then
              open=$(gh pr list --repo "$REPO" --head "$branch" --state open --json url --jq '.[0].url // ""')
              if [ -n "$open" ]; then
                echo "$name $version is already proposed: $open"
              else
                echo "::warning::branch $branch exists but has no open pull request, so $name $version is not proposed: open one from it, or delete the branch and rerun this workflow"
              fi
              continue
            elif [ "$status" != 404 ]; then
              echo "::error::cannot check for a branch $branch (HTTP ${status:-none}): is HOMEBREW_TAP_TOKEN valid?"
              exit 1
            fi
            gh api "repos/$REPO/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base_commit" > /dev/null
            gh api -X PUT "repos/$REPO/contents/Formula/$name.rb" \
              -f "message=$name $version" \
              -f "content=$(base64 -w0 "formulae/$name.rb")" \
              -f "sha=$base_blob" \
              -f "branch=$branch" > /dev/null
            url=$(gh pr create --repo "$REPO" --base main --head "$branch" \
              --title "$name $version" \
              --body "Bumps the formula to $name $version, its project's latest release, verified by this repository's scripts. It merges by itself once the required checks pass.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            gh pr merge "$url" --auto --squash
            echo "Opened $url with auto-merge on."
          done
